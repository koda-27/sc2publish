[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sc2publish"
version = "0.1.0"
description = "Headless StarCraft II map builder and Battle.net publisher"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "koda-27"}]
maintainers = [{name = "koda-27"}]
keywords = ["starcraft2", "battle-net", "map-publishing", "mpq", "cli", "headless"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "click>=8.1,<9",
  "platformdirs>=4,<5",
  "websocket-client>=1.8,<2",
  "pycryptodome>=3.20,<4",
  "tqdm>=4.66,<5",
  "Pillow>=10,<13",
  "mpyq>=0.2.5,<0.3",
  "requests>=2.32,<3",
  "keyring>=25,<26",
]

[project.scripts]
sc2publish = "sc2publish.cli:main"

[project.urls]
Homepage = "https://github.com/koda-27/sc2publish"
Documentation = "https://github.com/koda-27/sc2publish/tree/main/docs"
Source = "https://github.com/koda-27/sc2publish"
Issues = "https://github.com/koda-27/sc2publish/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "twine>=6", "ruff>=0.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/sc2publish"]
artifacts = ["src/sc2publish/data/*.json.gz"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "scripts", ".github", ".env.example", ".gitignore", "README.md", "LICENSE", "THIRD_PARTY.md", "pyproject.toml", "uv.lock", "SHARE_FILES.txt"]
exclude = ["**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
